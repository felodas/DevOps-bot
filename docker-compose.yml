version: '3.8'

services:
  db:
    build:
      context: ./devops_bot/db
      dockerfile: Dockerfile
    container_name: db
    user: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all 0.0.0.0/0 md5"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./devops_bot/db/init_master.sql:/docker-entrypoint-initdb.d/init.sql
    command: |
      postgres 
      -c wal_level=replica 
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby_feedback=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  repl:
    build:
      context: ./devops_bot/repl
      dockerfile: Dockerfile
    container_name: repl
    user: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      PGUSER: ${REPLICATION_USER}
      PGPASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - repl_data:/var/lib/postgresql/data
      - ./devops_bot/repl/init_repl.sh:/docker-entrypoint-initdb.d/init_repl.sh
    command: |
      bash -c "
      rm -rf /var/lib/postgresql/data/*
      until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=db --port=5432 -U ${REPLICATION_USER}
      do
        echo 'Waiting for primary to connect...'
        sleep 5
      done
      echo 'Backup done, starting replica...'
      chmod 0700 /var/lib/postgresql/data
      postgres
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

  bot:
    build:
      context: ./devops_bot/bot
      dockerfile: Dockerfile
    container_name: bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bot_network

volumes:
  db_data:
  repl_data:

networks:
  bot_network:
    driver: bridge
